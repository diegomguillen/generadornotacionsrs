<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Notación de Requisitos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1F2937; }
        ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6B7280; }
        .input-base {
            @apply w-full bg-white border border-gray-400 rounded-md shadow-sm placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm px-3 py-2;
            color: black;
        }
        .btn {
            @apply px-4 py-2 rounded-md font-semibold text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors duration-200;
        }
        .btn-sm { @apply px-2 py-1 text-xs; }
        .btn-primary { @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-500; }
        .btn-secondary { @apply bg-gray-600 hover:bg-gray-700 focus:ring-gray-500; }
        .btn-danger { @apply bg-red-600 hover:bg-red-700 focus:ring-red-500; }
    </style>
</head>
<body class="text-gray-200">

    <!-- DATALISTS FOR AUTOCOMPLETE -->
    <datalist id="contextos-list">
        <option value="cerrada"></option>
				<option value="abriendo_total"></option>
				<option value="abriendo_peatonal"></option>
        <option value="abierta_total"></option>
        <option value="abierta_peatonal"></option>
        <option value="parada_en_apertura"></option>
        <option value="parada_en_cierre"></option>
        <option value="parada_por_emergencia"></option>
    </datalist>
    <datalist id="eventos-list">
        <option value="impulso"></option>
        <option value="mantenido"></option>
        <option value="soltar"></option>
        <option value="activada"></option>
        <option value="interrumpida"></option>
        <option value="liberada"></option>
        <option value="error"></option>
        <option value="evento_a_definir"></option>
    </datalist>
		<datalist id="accion_actuador-list">
        <option value="abrir_puerta"></option>
        <option value="stop_puerta"></option>
        <option value="cerrar_puerta"></option>
        <option value="sem_verde_encender"></option>
        <option value="sem_verde_apagar"></option>
        <option value="sem_rojo_encender"></option>
        <option value="sem_rojo_apagar"></option>
        <option value="lam_dest_encender"></option>
				<option value="lam_dest_apagar"></option>
    </datalist>
		<datalist id="fuentes-list">
        <option value="BT1"></option>
        <option value="ST1"></option>
        <option value="BT2"></option>
        <option value="ST2"></option>
        <option value="FTA"></option>
        <option value="FTC"></option>
        <option value="BANDA"></option>
        <option value="FCA"></option>
				<option value="FCC"></option>
				<option value="STOP"></option>
				<option value="CANBUS"></option>
    </datalist>
		<datalist id="condiciones-list">
        <option value="hasta"></option>
    </datalist>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-7xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white">Generador de Notación de Requisitos</h1>
            <p class="mt-2 text-lg text-gray-400">Construye especificaciones formales de comportamiento.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Columna de Formularios -->
            <div class="flex flex-col gap-6">
                
                <div id="form-container" class="bg-gray-800/50 p-6 rounded-xl border border-gray-700 shadow-lg">
                    <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">1. Contexto General</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="contexto-entrada" class="block text-sm font-medium">Contexto de Entrada</label>
                            <input type="text" id="contexto-entrada" class="input-base mt-1" placeholder="Ej: cerrada" list="contextos-list">
                        </div>
                        <div>
                            <label for="contexto-salida" class="block text-sm font-medium">Contexto de Salida</label>
                            <input type="text" id="contexto-salida" class="input-base mt-1" placeholder="Ej: abriendo" list="contextos-list">
                        </div>
                    </div>
                     <div class="flex items-center">
                        <input id="ciclico" name="ciclico" type="checkbox" class="h-4 w-4 rounded border-gray-600 bg-gray-700 text-indigo-600 focus:ring-indigo-600">
                        <label for="ciclico" class="ml-2 block text-sm font-medium">Comportamiento Cíclico (`cíclico`)</label>
                    </div>
                </div>

                <div id="operations-section" class="bg-gray-800/50 p-6 rounded-xl border border-gray-700 shadow-lg">
                     <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">2. Secuencia de Operaciones</h2>
                    <div id="operations-container" class="space-y-6"></div>
                    <button id="add-operation" class="btn btn-secondary mt-6 w-full">Añadir Operación (→)</button>
                </div>
            </div>

            <!-- Columna de Previsualización y Análisis -->
            <div class="sticky top-8 self-start flex flex-col gap-6">
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                    <h2 class="text-xl font-semibold mb-4">3. Notación Generada</h2>
                    <div class="bg-gray-900 rounded-lg p-4 min-h-[100px] relative">
                        <pre><code id="notation-output" class="text-green-400 whitespace-pre-wrap break-words"></code></pre>
                        <button id="copy-button" class="btn btn-primary absolute down-4 right-4 text-sm">Copiar</button>
                    </div>
                    <p id="copy-feedback" class="text-sm text-green-400 mt-2 h-5"></p>
                </div>
                
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                    <h2 class="text-xl font-semibold mb-4">4. Análisis del Comportamiento</h2>
                    <div id="analysis-output" class="text-gray-300 text-sm space-y-2 prose prose-invert prose-sm max-w-none"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ELEMENTOS DEL DOM
            const operationsContainer = document.getElementById('operations-container');
            const outputCode = document.getElementById('notation-output');
            const analysisOutput = document.getElementById('analysis-output');
            const copyButton = document.getElementById('copy-button');
            const copyFeedback = document.getElementById('copy-feedback');

            // ESTADO INICIAL
            let state = {
                contextoEntrada: '',
                contextoSalida: '',
                ciclico: false,
                operations: []
            };

            // -------- LÓGICA DE RENDERIZADO --------

            const createOperationBlock = (opIndex) => { 
                 const opId = `op-${opIndex}`;
                return `
                    <div id="${opId}" class="operation-block bg-gray-900/50 p-4 rounded-lg border border-gray-700 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-medium text-indigo-400">Operación ${opIndex + 1}</h3>
                            ${opIndex > 0 ? `<button class="btn btn-danger btn-sm remove-operation" data-index="${opIndex}">Eliminar</button>` : ''}
                        </div>
                        <div>
                            <label for="${opId}-accion" class="block text-sm font-medium">Acción_Actuador</label>
                            <input type="text" id="${opId}-accion" data-index="${opIndex}" class="input-base mt-1 accion" placeholder="Ej: abrir_puerta" list="accion_actuador-list">
                        </div>
                        <div class="space-y-3">
                            <h4 class="text-sm font-medium">Disparadores (Fuente:Evento)</h4>
                            <div id="${opId}-disparadores" class="space-y-2"></div>
                            <button class="btn btn-secondary btn-sm add-disparador" data-index="${opIndex}">+ Añadir Disparador</button>
                        </div>
                        <div class="space-y-3">
                            <h4 class="text-sm font-medium">Condiciones {parámetro: valor}</h4>
                            <div id="${opId}-condiciones" class="space-y-2"></div>
                            <button class="btn btn-secondary btn-sm add-condicion" data-index="${opIndex}">+ Añadir Condición</button>
                        </div>
                    </div>
                `;
            };
            const createDisparadorInput = (opIndex, dispIndex) => {
                return `
                    <div class="flex items-center gap-2">
                        <input type="text" class="input-base disparador-fuente" data-op-index="${opIndex}" data-disp-index="${dispIndex}" placeholder="Fuente (Ej: BT1)" list="fuentes-list">
                        <span class="text-gray-400">:</span>
                        <input type="text" class="input-base disparador-evento" data-op-index="${opIndex}" data-disp-index="${dispIndex}" placeholder="Evento (Ej: impulso)" list="eventos-list">
                        <button class="btn btn-danger btn-sm remove-disparador" data-op-index="${opIndex}" data-disp-index="${dispIndex}">X</button>
                    </div>
                `;
            };
            const createCondicionInput = (opIndex, condIndex) => { 
                 return `
                    <div class="flex items-center gap-2">
                        <input type="text" class="input-base condicion-param" data-op-index="${opIndex}" data-cond-index="${condIndex}" placeholder="Parámetro (Ej: hasta)" list="condidiones-list">
                        <span class="text-gray-400">:</span>
                        <input type="text" class="input-base condicion-valor" data-op-index="${opIndex}" data-cond-index="${condIndex}" placeholder="Valor (Ej: FCA:activo)" list="condidiones-valor-list">
                        <button class="btn btn-danger btn-sm remove-condicion" data-op-index="${opIndex}" data-cond-index="${condIndex}">X</button>
                    </div>
                `;
            };

            const renderUI = () => {
                document.getElementById('contexto-entrada').value = state.contextoEntrada;
                document.getElementById('contexto-salida').value = state.contextoSalida;
                document.getElementById('ciclico').checked = state.ciclico;
                operationsContainer.innerHTML = state.operations.map((_, i) => createOperationBlock(i)).join('');
                state.operations.forEach((op, i) => {
                    const opId = `op-${i}`;
                    document.getElementById(`${opId}-accion`).value = op.accion;
                    const disparadoresContainer = document.getElementById(`${opId}-disparadores`);
                    disparadoresContainer.innerHTML = op.disparadores.map((_, j) => createDisparadorInput(i, j)).join('');
                    op.disparadores.forEach((disp, j) => {
                        document.querySelector(`[data-op-index="${i}"][data-disp-index="${j}"].disparador-fuente`).value = disp.fuente;
                        document.querySelector(`[data-op-index="${i}"][data-disp-index="${j}"].disparador-evento`).value = disp.evento;
                    });
                    const condicionesContainer = document.getElementById(`${opId}-condiciones`);
                    condicionesContainer.innerHTML = op.condiciones.map((_, j) => createCondicionInput(i, j)).join('');
                    op.condiciones.forEach((cond, j) => {
                        document.querySelector(`[data-op-index="${i}"][data-cond-index="${j}"].condicion-param`).value = cond.param;
                        document.querySelector(`[data-op-index="${i}"][data-cond-index="${j}"].condicion-valor`).value = cond.valor;
                    });
                });
                renderAllOutputs();
            };
            
            const renderAllOutputs = () => { 
                let notation = '';
                if (state.contextoEntrada) notation += `estado(${state.contextoEntrada}) ⇒ `;
                if (state.ciclico) notation += 'ciclico';
                if (state.operations.length > 0) {
                    notation += '[';
                    notation += state.operations.map(op => {
                        let opStr = op.accion || 'accion_vacia';
                        if (op.disparadores.length > 0) {
                            const dispStr = op.disparadores.map(d => `${d.fuente || 'fuente'}:${d.evento || 'evento'}`).join(', ');
                            opStr += `(${dispStr})`;
                        }
                        if (op.condiciones.length > 0) {
                             const condStr = op.condiciones.map(c => `${c.param || 'param'}:${c.valor || 'valor'}`).join(', ');
                             opStr += `{${condStr}}`;
                        }
                        return opStr;
                    }).join(' → ');
                    notation += ']';
                }
                if (state.contextoSalida) notation += ` ⇒ estado(${state.contextoSalida})`;
                outputCode.textContent = notation;
                let analysis = '<p>Este requisito describe ';
                const isAtomic = state.operations.length > 1 || state.operations.some(op => op.condiciones.length > 0);
                if(state.ciclico){
                    analysis += 'un <strong>comportamiento Cíclico</strong>. La secuencia se repetirá indefinidamente mientras el contexto de entrada sea válido.</p>';
                } else if(isAtomic) {
                    analysis += 'una <strong>Maniobra Atómica</strong>. Una vez iniciada, se compromete a completar la secuencia e ignorará otros eventos no prioritarios.</p>';
                } else {
                    analysis += 'una <strong>Transición Simple</strong>. Es un comportamiento interrumpible que define un solo paso de una máquina de estados.</p>';
                }
                let analysisList = '<ul>';
                if (state.contextoEntrada) {
                    analysisList += `<li><strong>Contexto de Entrada:</strong> La regla se activa únicamente en el estado o estados: <code>${state.contextoEntrada}</code>.</li>`;
                }
                if (state.operations.length > 0) {
                    analysisList += '<li><strong>Operaciones:</strong>';
                    analysisList += '<ul>';
                    state.operations.forEach((op, i) => {
                        let opAnalysis = `<li>Paso ${i+1}: `;
                        if(op.disparadores.length > 0) {
                           opAnalysis += `Al recibir el/los disparador(es) <code>${op.disparadores.map(d => d.fuente).join(', ')}</code>, se ejecuta la acción <strong>${op.accion || 'accion_vacia'}</strong>.`;
                        } else {
                           opAnalysis += `Se ejecuta la acción <strong>${op.accion || 'accion_vacia'}</strong>.`;
                        }
                        if(op.condiciones.length > 0) {
                           opAnalysis += ` La maniobra continúa hasta que se cumple la condición: <code>${op.condiciones.map(c => c.param + ':' + c.valor).join(' y ')}</code>.`;
                        }
                       opAnalysis += '</li>';
                       analysisList += opAnalysis;
                    });
                    analysisList += '</ul></li>';
                }
                if (state.contextoSalida) {
                    analysisList += `<li><strong>Contexto de Salida:</strong> Al finalizar, el sistema transita al estado: <code>${state.contextoSalida}</code>.</li>`;
                }
                 analysisList += '</ul>';
                analysisOutput.innerHTML = analysis + analysisList;
            };

            // -------- MANEJO DE ESTADO Y EVENTOS --------
            
            const addNewOperation = () => { 
                state.operations.push({
                    accion: '',
                    disparadores: [],
                    condiciones: []
                });
                renderUI();
            };

            const updateStateFromUI = () => { 
                state.contextoEntrada = document.getElementById('contexto-entrada').value;
                state.contextoSalida = document.getElementById('contexto-salida').value;
                state.ciclico = document.getElementById('ciclico').checked;
                state.operations = [];
                document.querySelectorAll('.operation-block').forEach((opBlock, i) => {
                    const newOp = {
                        accion: opBlock.querySelector('.accion').value,
                        disparadores: [],
                        condiciones: []
                    };
                    opBlock.querySelectorAll('.disparador-fuente').forEach((fuenteEl, j) => {
                        newOp.disparadores.push({fuente: fuenteEl.value, evento: opBlock.querySelector(`.disparador-evento[data-disp-index="${j}"]`).value});
                    });
                    opBlock.querySelectorAll('.condicion-param').forEach((paramEl, j) => {
                        newOp.condiciones.push({param: paramEl.value, valor: opBlock.querySelector(`.condicion-valor[data-cond-index="${j}"]`).value});
                    });
                    state.operations.push(newOp);
                });
                renderAllOutputs();
            };
            
            // Event listener para toda la app
            document.body.addEventListener('input', (e) => {
                const target = e.target;
                if(target.matches('.input-base, #ciclico')) {
                    // Forzar may/min
                    if (target.classList.contains('disparador-fuente')) {
                        target.value = target.value.toUpperCase();
                    } else if (target.type === 'text') {
                        //target.value = target.value.toLowerCase();
                    }
                    updateStateFromUI();
                }
            });

            document.body.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if(!target) return;
                
                if (target.id === 'add-operation') addNewOperation();
                if (target.matches('.remove-operation')) { state.operations.splice(parseInt(target.dataset.index), 1); if (state.operations.length === 0) addNewOperation(); else renderUI(); }
                if (target.matches('.add-disparador')) { state.operations[parseInt(target.dataset.index)].disparadores.push({fuente: '', evento: ''}); renderUI(); }
                if (target.matches('.remove-disparador')) { state.operations[parseInt(target.dataset.opIndex)].disparadores.splice(parseInt(target.dataset.dispIndex), 1); renderUI(); }
                if (target.matches('.add-condicion')) { state.operations[parseInt(target.dataset.index)].condiciones.push({param: '', valor: ''}); renderUI(); }
                if (target.matches('.remove-condicion')) { state.operations[parseInt(target.dataset.opIndex)].condiciones.splice(parseInt(target.dataset.condIndex), 1); renderUI(); }
            });
            
             copyButton.addEventListener('click', () => {
                const textToCopy = outputCode.textContent;
                const textArea = document.createElement('textarea');
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copyFeedback.textContent = '¡Copiado al portapapeles!';
                } catch (err) { copyFeedback.textContent = 'Error al copiar.'; }
                document.body.removeChild(textArea);
                setTimeout(() => { copyFeedback.textContent = ''; }, 2000);
            });


            // INICIALIZACIÓN
            addNewOperation();
        });
    </script>
</body>
</html>
